name: Build GTA Plugin
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build DLL
        run: dotnet build src/VWeatherStationGTA.csproj -c Release -o build
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: VWeatherStationGTA
          path: build/VWeatherStationGTA.dll
