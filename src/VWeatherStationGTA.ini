[General]
Enabled=true
TelemetryEnabled=true
TelemetryIntervalSeconds=2

[Connection]
SiteUrl=https://vweatherstation.com
ApiBaseUrl=https://vweatherstation.com/api/v1

[Features]
RemoteWeather=true

; --- Pull real-world weather INTO the game ---
; When true, the plugin fetches live weather for the coordinates below and
; sets GTA V's weather to match the real world.
PullRealWeather = false
RealWeatherLat = 51.5074
RealWeatherLon = -0.1278
RealWeatherIntervalSeconds = 600
